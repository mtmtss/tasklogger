<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <? if (APPLE_TOUCH_ICON_URL) { ?>
      <link rel="apple-touch-icon" sizes="180x180" href="<?= APPLE_TOUCH_ICON_URL ?>">
      <link rel="icon" type="image/png" sizes="180x180" href="<?= APPLE_TOUCH_ICON_URL ?>">
    <? } ?>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="タスクアーカイブ">
    <meta name="theme-color" content="#0f766e">
    <style>
      :root {
        --bg: #050912;
        --bg-2: #0a1020;
        --card: rgba(9, 14, 28, 0.88);
        --line: rgba(83, 240, 217, 0.24);
        --line-strong: rgba(83, 240, 217, 0.52);
        --text: #e8fffb;
        --muted: #8bbeb8;
        --teal: #53f0d9;
        --teal-deep: #00b8d9;
        --pink: #ff5ccf;
        --teal-soft: rgba(83, 240, 217, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(83, 240, 217, 0.16), transparent 24%),
          radial-gradient(circle at top left, rgba(255, 92, 207, 0.08), transparent 20%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
        background: rgba(5, 9, 18, 0.86);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(83, 240, 217, 0.16);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      }

      .nav-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .nav-link,
      button,
      select,
      input[type="date"] {
        border: 1px solid rgba(83, 240, 217, 0.28);
        border-radius: 999px;
        background: rgba(9, 14, 28, 0.82);
        color: var(--text);
        padding: 9px 14px;
        font-size: 14px;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .nav-link {
        text-decoration: none;
      }

      .nav-link:hover,
      button:hover,
      select:hover,
      input[type="date"]:hover {
        transform: translateY(-1px);
        border-color: rgba(83, 240, 217, 0.58);
        box-shadow: 0 0 0 1px rgba(83, 240, 217, 0.14), 0 12px 26px rgba(0, 0, 0, 0.24);
      }

      .nav-link.is-active,
      button.primary {
        background: linear-gradient(135deg, rgba(83, 240, 217, 0.86), rgba(0, 184, 217, 0.92));
        border-color: rgba(183, 255, 244, 0.72);
        color: #04101b;
        box-shadow: 0 0 22px rgba(83, 240, 217, 0.18);
      }

      button {
        cursor: pointer;
      }

      .hero,
      .summary-card,
      .panel,
      .list-item {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
      }

      .hero {
        padding: 20px;
        margin-bottom: 16px;
        background:
          linear-gradient(135deg, rgba(83, 240, 217, 0.12), transparent 48%),
          linear-gradient(180deg, rgba(9, 14, 28, 0.98), rgba(10, 16, 32, 0.9));
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: 0.03em;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
      }

      .error-panel {
        display: none;
        background: rgba(70, 12, 28, 0.66);
        border: 1px solid rgba(251, 113, 133, 0.42);
        color: #ffd6de;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 16px;
        white-space: pre-wrap;
      }

      .filter-bar {
        position: sticky;
        top: 65px;
        z-index: 15;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: end;
        padding: 14px;
        margin-bottom: 16px;
        background: rgba(5, 9, 18, 0.84);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field label {
        font-size: 12px;
        color: var(--muted);
      }

      .top-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary-card {
        padding: 16px;
      }

      .summary-label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .summary-value {
        margin-top: 6px;
        font-size: 28px;
        font-weight: 800;
        text-shadow: 0 0 18px rgba(83, 240, 217, 0.16);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        padding: 16px;
        background:
          linear-gradient(180deg, rgba(9, 14, 28, 0.96), rgba(10, 16, 32, 0.92));
      }

      .panel h2 {
        margin: 0 0 6px;
        font-size: 18px;
        letter-spacing: 0.04em;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: end;
        margin-bottom: 12px;
      }

      .scroll-area {
        max-height: 62vh;
        overflow: auto;
        display: grid;
        gap: 10px;
        padding-right: 4px;
      }

      .list-item {
        padding: 12px;
        background: rgba(10, 16, 32, 0.86);
      }

      .list-title {
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .time-bar {
        height: 8px;
        background: rgba(10, 24, 34, 0.96);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
        box-shadow: inset 0 0 0 1px rgba(83, 240, 217, 0.12);
      }

      .time-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--pink) 48%, var(--teal-deep));
        box-shadow: 0 0 16px rgba(83, 240, 217, 0.34);
      }

      .empty {
        padding: 20px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .scroll-area {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="nav-title">タスクアーカイブ</div>
      <div class="nav-links">
        <a class="nav-link" href="<?= APP_BASE_URL ?>">今日</a>
        <a class="nav-link is-active" href="<?= APP_BASE_URL ?>?page=archive">アーカイブ</a>
      </div>
    </div>

    <div class="page">
      <div id="error" class="error-panel"></div>

      <section class="hero">
        <h1>過去のタスクアーカイブ</h1>
        <div class="meta">期間を切り替えながら、作業時間の偏りを一覧できます。タスク数が多い場合でも、各エリア内スクロールで見られるようにしています。</div>
      </section>

      <section class="filter-bar">
        <div class="field">
          <label for="archiveStartDate">開始日</label>
          <input id="archiveStartDate" type="date">
        </div>
        <div class="field">
          <label for="archiveEndDate">終了日</label>
          <input id="archiveEndDate" type="date">
        </div>
        <button class="primary" onclick="loadArchive()">集計する</button>
        <button onclick="applyArchivePreset(7)">7日</button>
        <button onclick="applyArchivePreset(30)">30日</button>
        <button onclick="applyArchivePreset(90)">90日</button>
        <div class="field">
          <label for="taskLimit">表示件数</label>
          <select id="taskLimit" onchange="renderArchive(currentArchive)">
            <option value="10">10件</option>
            <option value="20" selected>20件</option>
            <option value="50">50件</option>
            <option value="9999">すべて</option>
          </select>
        </div>
      </section>

      <div id="topSummary" class="top-summary"></div>

      <div class="layout">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>日別の作業時間</h2>
              <div class="meta" id="rangeText"></div>
            </div>
          </div>
          <div id="byDate" class="scroll-area"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>種類別</h2>
              <div class="meta">現在はタスクリスト単位で集計</div>
            </div>
          </div>
          <div id="byTaskList" class="scroll-area"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>タスク別</h2>
              <div class="meta">上位タスクをコンパクト表示</div>
            </div>
          </div>
          <div id="byTask" class="scroll-area"></div>
        </section>
      </div>
    </div>

    <script>
      let currentArchive = null;

      function loadInitialArchive() {
        clearError();
        setArchiveLoading();

        google.script.run
          .withSuccessHandler(data => {
            currentArchive = (data && data.archive) || null;
            renderArchive(currentArchive);
          })
          .withFailureHandler(error => showError('アーカイブ初期読み込み', error))
          .getArchiveDashboardPageData();
      }

      function loadArchive() {
        clearError();
        setArchiveLoading();

        google.script.run
          .withSuccessHandler(data => {
            currentArchive = data || null;
            renderArchive(currentArchive);
          })
          .withFailureHandler(error => showError('アーカイブ集計', error))
          .getArchiveAnalyticsData(
            document.getElementById('archiveStartDate').value,
            document.getElementById('archiveEndDate').value
          );
      }

      function renderArchive(archive) {
        currentArchive = archive;
        syncArchiveControls(archive);

        if (!archive) {
          renderEmptyState('アーカイブデータを取得できませんでした。');
          return;
        }

        renderTopSummary(archive);
        document.getElementById('rangeText').textContent = `${archive.startDate} 〜 ${archive.endDate}`;

        if (!archive.totalSessions) {
          renderEmptyState('この期間の作業ログはありません。');
          return;
        }

        const limit = Number(document.getElementById('taskLimit').value || 20);
        renderList(
          document.getElementById('byDate'),
          archive.byDate.filter(item => item.totalMinutes > 0),
          item => item.date,
          item => `${item.totalMinutes} 分 / ${item.sessionCount} 回`,
          getMaxValue(archive.byDate, 'totalMinutes'),
          limit
        );
        renderList(
          document.getElementById('byTaskList'),
          archive.byTaskList,
          item => item.taskListName,
          item => `${item.totalMinutes} 分 / ${item.sessionCount} 回 / 完了 ${item.completedCount} 回`,
          getMaxValue(archive.byTaskList, 'totalMinutes'),
          limit
        );
        renderList(
          document.getElementById('byTask'),
          archive.byTask,
          item => item.taskTitle,
          item => `${item.taskListName} / ${item.totalMinutes} 分 / ${item.sessionCount} 回 / 最終 ${item.lastWorkedDate}`,
          getMaxValue(archive.byTask, 'totalMinutes'),
          limit
        );
      }

      function renderTopSummary(archive) {
        document.getElementById('topSummary').innerHTML = `
          <div class="summary-card">
            <div class="summary-label">合計作業時間</div>
            <div class="summary-value">${archive.totalMinutes}<span class="meta"> 分</span></div>
          </div>
          <div class="summary-card">
            <div class="summary-label">1日平均</div>
            <div class="summary-value">${archive.averageMinutesPerDay}<span class="meta"> 分</span></div>
          </div>
          <div class="summary-card">
            <div class="summary-label">作業した日数</div>
            <div class="summary-value">${archive.activeDays}<span class="meta"> 日</span></div>
          </div>
          <div class="summary-card">
            <div class="summary-label">セッション数</div>
            <div class="summary-value">${archive.totalSessions}<span class="meta"> 回</span></div>
          </div>
          <div class="summary-card">
            <div class="summary-label">完了数</div>
            <div class="summary-value">${archive.completedSessions}<span class="meta"> 回</span></div>
          </div>
        `;
      }

      function renderList(target, items, titleGetter, detailGetter, maxValue, limit) {
        const limitedItems = limit >= 9999 ? items : items.slice(0, limit);

        if (!limitedItems.length) {
          target.innerHTML = '<div class="empty">表示できるデータがありません。</div>';
          return;
        }

        target.innerHTML = limitedItems.map(item => `
          <div class="list-item">
            <div class="list-title">${escapeHtml(titleGetter(item))}</div>
            <div class="meta">${escapeHtml(detailGetter(item))}</div>
            ${renderMiniBar(item.totalMinutes, maxValue)}
          </div>
        `).join('');
      }

      function renderMiniBar(value, maxValue) {
        const safeMax = Math.max(Number(maxValue || 0), 1);
        const ratio = Math.min(100, Math.round((Number(value || 0) / safeMax) * 100));

        return `
          <div class="time-bar">
            <div class="time-bar-fill" style="width: ${ratio}%"></div>
          </div>
        `;
      }

      function getMaxValue(items, key) {
        return Math.max(...(items || []).map(item => Number(item[key] || 0)), 1);
      }

      function syncArchiveControls(archive) {
        if (!archive) return;
        document.getElementById('archiveStartDate').value = archive.startDate || '';
        document.getElementById('archiveEndDate').value = archive.endDate || '';
      }

      function applyArchivePreset(days) {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - Number(days || 1) + 1);

        document.getElementById('archiveStartDate').value = formatDateInputValue(start);
        document.getElementById('archiveEndDate').value = formatDateInputValue(end);
        loadArchive();
      }

      function formatDateInputValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function setArchiveLoading() {
        document.getElementById('topSummary').innerHTML = '';
        document.getElementById('rangeText').textContent = '読み込み中...';
        document.getElementById('byDate').innerHTML = '<div class="empty">読み込み中...</div>';
        document.getElementById('byTaskList').innerHTML = '<div class="empty">読み込み中...</div>';
        document.getElementById('byTask').innerHTML = '<div class="empty">読み込み中...</div>';
      }

      function renderEmptyState(message) {
        document.getElementById('topSummary').innerHTML = '';
        document.getElementById('rangeText').textContent = '';
        document.getElementById('byDate').innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
        document.getElementById('byTaskList').innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
        document.getElementById('byTask').innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
      }

      function showError(context, error) {
        const panel = document.getElementById('error');
        panel.style.display = 'block';
        panel.textContent = `${context}でエラーが発生しました。\n${formatError(error)}`;
      }

      function clearError() {
        const panel = document.getElementById('error');
        panel.style.display = 'none';
        panel.textContent = '';
      }

      function formatError(error) {
        if (!error) return '原因を特定できませんでした。';
        if (typeof error === 'string') return error;
        if (error.message && error.stack) return `${error.message}\n${error.stack}`;
        if (error.message) return error.message;

        try {
          return JSON.stringify(error, null, 2);
        } catch (jsonError) {
          return String(error);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      loadInitialArchive();
    </script>
  </body>
</html>
